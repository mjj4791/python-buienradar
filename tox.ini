[tox]
envlist = lint, typing, py311, py312, py313, py314, py315
skip_missing_interpreters = False

[testenv]
basepython = {env:PYTHON3_PATH:python3.15}
commands = py.test \
           --doctest-modules \
           --cov-report term-missing \
           --cov=buienradar \
           --cache-clear \
           buienradar tests {posargs}
deps =
  docopt
  requests
  pytz
  pytest
  pytest-cov
  pytest-xdist
  requests-mock
  syrupy
usedevelop = True

[testenv:py311]
basepython = python3.11

[testenv:py312]
basepython = python3.12

[testenv:py313]
basepython = python3.13

[testenv:py314]
basepython = python3.14

[testenv:py315]
basepython = python3.15

[testenv:lint]
commands =
    pylama setup.py buienradar tests
    flake8 buienradar tests
deps =
  isort
  flake8
  pylama
  pydocstyle

[testenv:typing]
commands = mypy buienradar --ignore-missing-imports --follow-imports=skip
deps =
  mypy
  types-pytz
  types-requests
  types-setuptools

[pytest]
testpaths = tests
deps =
  pytz
  xmltodict
